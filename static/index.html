<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADAR — Media Release Acquisition & Discovery</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo-group">
        <div class="radar-scan-icon">
          <div class="radar-sweep"></div>
          <div class="radar-dot"></div>
        </div>
        <div class="logo-text">
          <h1>RADAR</h1>
          <span class="logo-sub">Release Acquisition & Discovery Automated Radar</span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="category-tabs">
        <button class="cat-btn active" data-category="movies">
          <span class="cat-icon">🎬</span> Фильмы
        </button>
        <button class="cat-btn" data-category="series">
          <span class="cat-icon">📺</span> Сериалы
        </button>
        <button class="cat-btn" data-category="games">
          <span class="cat-icon">🎮</span> Игры
        </button>
        <button class="cat-btn" data-category="software">
          <span class="cat-icon">💻</span> Программы
        </button>
        <div class="nav-divider"></div>
        <button class="cat-btn cat-watchlist" data-category="watchlist" title="Отобранные фильмы к просмотру">
          <span class="cat-icon">💚</span> Буду смотреть <span class="nav-count" id="count-watchlist">0</span>
        </button>
        <button class="cat-btn cat-ignored" data-category="ignored" title="Отклонённые фильмы">
          <span class="cat-icon">🚫</span> Не буду смотреть <span class="nav-count" id="count-ignored">0</span>
        </button>
      </nav>
    </div>
    <!-- Global Full-Width Loading Progress Bar -->
    <div id="global-progress-bar" class="global-progress-bar"></div>
  </header>

  <!-- Filter & Controls Toolbar -->
  <section class="filters-panel">
    <div class="filters-container">
      <!-- Tracker Scan Button -->
      <button id="btn-refresh" class="btn-refresh" title="Сканировать трекер и обновить базу данных">
        <span class="refresh-icon">🔄</span> Сканировать трекер
      </button>

      <!-- Search Input & Button -->
      <div class="filter-group search-group">
        <span class="filter-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Поиск по названию" />
      </div>

      <button id="btn-apply-filters" class="btn-primary btn-apply" title="Применить выбранные фильтры и начать поиск">
        🔍 Найти
      </button>

      <!-- Quality Filter -->
      <div class="filter-group quality-group" id="quality-filter-wrap">
        <label>Качество:</label>
        <label class="checkbox-label">
          <input type="checkbox" id="q-1080p" checked value="1080p"> 1080p
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="q-720p" checked value="720p"> 720p
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="q-4k" value="4K"> 4K
        </label>
      </div>

      <!-- Rating Filter -->
      <div class="filter-group rating-group" id="rating-filter-wrap">
        <label class="checkbox-label">
          <input type="checkbox" id="rating-toggle">
          <span>⭐ Рейтинг > 7.0</span>
        </label>
      </div>

      <!-- Russian Filter -->
      <div class="filter-group russian-group" id="russian-filter-wrap">
        <label class="checkbox-label">
          <input type="checkbox" id="russian-toggle">
          <span>Русское</span>
        </label>
      </div>

      <!-- Year Dropdown -->
      <div class="filter-group year-group" id="year-filter-wrap">
        <label for="year-select">Год:</label>
        <select id="year-select">
          <option value="all" selected>Все годы</option>
          <option value="2026">2026 год</option>
          <option value="2025">2025 год</option>
          <option value="2024">2024 год</option>
          <option value="2023">2023 год</option>
        </select>
      </div>

      <!-- Genre Dropdown -->
      <div class="filter-group genre-group" id="genre-filter-wrap">
        <label for="genre-select">Жанр:</label>
        <select id="genre-select">
          <option value="all">Все жанры</option>
        </select>
      </div>

      <!-- Reset Filters -->
      <button id="btn-reset-filters" class="btn-reset" title="Сбросить все фильтры на стандартные">
        ✕ Сброс
      </button>
    </div>
  </section>

  <!-- Main Content View -->
  <main class="main-content">
    <div class="results-header">
      <div class="results-info">
        <span id="results-count">Поиск релизов на радаре...</span>
      </div>
      <div class="current-filters-tags" id="active-filters-display"></div>
    </div>

    <!-- Cards Grid (15 per page) -->
    <div class="cards-grid" id="cards-grid"></div>

    <!-- Compact Table View for 'Не буду смотреть' -->
    <div class="table-view-container" id="table-view-container" style="display: none;">
      <table class="ignored-table">
        <thead>
          <tr>
            <th>Название фильма</th>
            <th>Год</th>
            <th>Жанр</th>
            <th>Рейтинги</th>
            <th style="text-align: right;">Действие</th>
          </tr>
        </thead>
        <tbody id="ignored-table-body"></tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display: none;">
      <div class="empty-icon">📡</div>
      <h3>Ничего не обнаружено с текущими фильтрами</h3>
      <p>Попробуйте сбросить фильтр по дате или снять галочку рейтинга > 7.0.</p>
      <button class="btn-primary" onclick="resetFilters()">Сбросить фильтры</button>
    </div>

    <!-- Pagination Controls -->
    <nav class="pagination-bar" id="pagination-bar">
      <button id="btn-prev" class="btn-page" disabled>◀ Предыдущая</button>
      <div class="page-indicator">
        Страница <span id="current-page">1</span> из <span id="total-pages">1</span>
      </div>
      <button id="btn-next" class="btn-page" disabled>Следующая ▶</button>
    </nav>
  </main>

  <!-- Full Detail Modal (All 16 Fields) -->
  <div class="modal-overlay" id="detail-modal" style="display: none;">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" title="Закрыть (Esc)">✕</button>
      <div class="modal-body" id="modal-content"></div>
    </div>
  </div>

  <!-- Interactive Debug Console at the bottom -->
  <footer class="debug-console" id="debug-console">
    <div class="console-header" id="console-toggle">
      <div class="console-title">
        <span class="status-indicator"></span>
        <strong>КОНСОЛЬ ОТЛАДКИ РАДАРА</strong>
        <span class="console-status-text" id="console-status-text">Готов к работе</span>
      </div>
      <div class="console-controls">
        <button id="console-minimize-btn" title="Свернуть / Развернуть консоль">_</button>
      </div>
    </div>
    <div class="console-body" id="console-log-feed"></div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
